[package]
name = "pcsc-rs-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
# TLS goes through the OS (schannel / Secure Transport / OpenSSL): no bundled root list
tungstenite = { version = "=0.30.0", features = ["native-tls"] }

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
