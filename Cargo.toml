[package]
name = "pcsc-rs-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.151"
# TLS goes through the OS (schannel / Secure Transport) or a bundled OpenSSL on Linux
tungstenite = { version = "=0.30.0", features = ["native-tls-vendored"] }

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1